<svg viewBox="0 0 860 380" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Uma mensagem do WhatsApp entra pelo webhook da Evolution API, é processada por uma Lambda que chama o Claude para extrair o evento, grava no DynamoDB e cria o evento no Google Calendar, e a confirmação volta pelo mesmo caminho para o WhatsApp.">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/>
    </marker>
  </defs>

  <style>
    text { font-family: -apple-system, "Segoe UI", Roboto, sans-serif; fill: #1f2937; }
    .label { font-size: 12px; fill: #4b5563; }
    .node-label { font-size: 13px; font-weight: 600; }
    .sub-label { font-size: 10.5px; fill: #6b7280; }
    rect.node { fill: #ffffff; stroke: #1f2937; stroke-width: 1.5; }
    rect.accent { stroke: #16a34a; stroke-width: 2.5; }
    line.flow { stroke: #1f2937; stroke-width: 1.5; marker-end: url(#arrow); }
  </style>

  <rect x="0" y="0" width="860" height="380" fill="#ffffff"/>

  <!-- Você -->
  <circle cx="70" cy="242" r="30" class="node" fill="#ffffff" stroke="#1f2937" stroke-width="1.5"/>
  <text x="70" y="238" text-anchor="middle" class="node-label">Você</text>
  <text x="70" y="253" text-anchor="middle" class="sub-label">WhatsApp</text>

  <!-- Evolution API -->
  <rect x="170" y="214" width="140" height="56" rx="8" class="node"/>
  <text x="240" y="238" text-anchor="middle" class="node-label">Evolution API</text>
  <text x="240" y="254" text-anchor="middle" class="sub-label">gateway WhatsApp</text>

  <!-- Lambda -->
  <rect x="390" y="214" width="150" height="56" rx="8" class="node"/>
  <text x="465" y="238" text-anchor="middle" class="node-label">AWS Lambda</text>
  <text x="465" y="254" text-anchor="middle" class="sub-label">handleWhatsappWebhook</text>

  <!-- Claude AI -->
  <rect x="390" y="70" width="150" height="56" rx="8" class="node accent"/>
  <text x="465" y="94" text-anchor="middle" class="node-label">Claude (Haiku)</text>
  <text x="465" y="110" text-anchor="middle" class="sub-label">extrai título/data/hora</text>

  <!-- Google Calendar -->
  <rect x="630" y="140" width="160" height="56" rx="8" class="node"/>
  <text x="710" y="164" text-anchor="middle" class="node-label">Google Calendar</text>
  <text x="710" y="180" text-anchor="middle" class="sub-label">cria o evento</text>

  <!-- DynamoDB -->
  <rect x="630" y="300" width="160" height="56" rx="8" class="node"/>
  <text x="710" y="324" text-anchor="middle" class="node-label">DynamoDB</text>
  <text x="710" y="340" text-anchor="middle" class="sub-label">mensagens · eventos · users</text>

  <!-- Fluxo de ida -->
  <line x1="102" y1="232" x2="168" y2="232" class="flow"/>
  <text x="135" y="222" text-anchor="middle" class="label">mensagem</text>

  <line x1="312" y1="232" x2="388" y2="232" class="flow"/>
  <text x="350" y="219" text-anchor="middle" class="label">webhook POST</text>

  <line x1="465" y1="212" x2="465" y2="128" class="flow"/>
  <text x="480" y="172" class="label">extrai evento</text>

  <line x1="524" y1="222" x2="628" y2="176" class="flow"/>
  <text x="605" y="200" text-anchor="middle" class="label">cria evento</text>

  <line x1="524" y1="256" x2="628" y2="308" class="flow"/>
  <text x="600" y="298" text-anchor="middle" class="label">salva histórico</text>

  <!-- Fluxo de volta (confirmação) -->
  <line x1="388" y1="256" x2="312" y2="256" class="flow"/>
  <text x="350" y="272" text-anchor="middle" class="label">confirmação</text>

  <line x1="168" y1="256" x2="102" y2="256" class="flow"/>
  <text x="135" y="272" text-anchor="middle" class="label">resposta</text>
</svg>
